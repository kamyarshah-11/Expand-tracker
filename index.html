<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expand Tracker</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header class="upper">
            <div class="title-area">
                <span class="badge">FINANCE TRACKER</span>
                <h1>Kamyar Expense Tracker</h1>
                <p>Manage your income and expenses easily.</p>
            </div>

            <button id="theme" class="theme-btn" onclick="changeTheme()">
                ☀️ Light Mode
            </button>
        </header>


        <!-- Summary -->
        <section class="summary">

            <div class="summary-card income-card">
                <div class="summary-icon">↗</div>

                <div>
                    <p>Total Income</p>
                    <h2 id="totalIncome">0</h2>
                </div>
            </div>


            <div class="summary-card payed-card">
                <div class="summary-icon">↘</div>

                <div>
                    <p>Total Expenses</p>
                    <h2 id="totalPayed">0</h2>
                </div>
            </div>


            <div class="summary-card total-card">
                <div class="summary-icon">Σ</div>

                <div>
                    <p>Balance</p>
                    <h2 id="total">0</h2>
                </div>
            </div>

        </section>


        <!-- Add transaction -->
        <section class="adding">

            <div class="section-title">
                <div>
                    <span class="small-title">NEW TRANSACTION</span>
                    <h2>Add Transaction</h2>
                </div>
            </div>


            <div class="form-grid">

                <div class="input-group">
                    <label for="nameInp">Name</label>
                    <input type="text" id="nameInp" placeholder="e.g. Salary">
                </div>


                <div class="input-group">
                    <label for="amountInp">Amount</label>
                    <input type="number" id="amountInp" min="0" placeholder="e.g. 5000">
                </div>


                <div class="input-group">
                    <label for="descriptionInp">Description</label>
                    <input type="text" id="descriptionInp" placeholder="What was this transaction for?">
                </div>


                <div class="input-group">
                    <label for="selected">Type</label>

                    <select id="selected">
                        <option value="income">Income</option>
                        <option value="payed">Expense</option>
                    </select>
                </div>

            </div>


            <button id="addBtn" onclick="adding()">
                <span>＋</span>
                Add Transaction
            </button>

        </section>


        <!-- Transactions -->
        <section class="table-card">

            <div class="table-header">
                <div>
                    <span class="small-title">TRANSACTIONS</span>
                    <h2>Transaction History</h2>
                </div>
            </div>


            <div class="table-wrapper">

                <table id="table">



                </table>

            </div>

        </section>

    </div>


    <script src="./script/app.js"></script>

</body>

</html>
